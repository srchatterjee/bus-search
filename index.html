<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Locate Your All Hands Transportation Assignment</title>
  <style>
    /* Reset & Core Styling */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #ffffff;
      color: #333333;
      line-height: 1.5;
    }

    /* Full Width Top Blue Banner Header */
    .header-banner {
      background-color: #0078d4; /* Power Apps / Microsoft Blue */
      color: #ffffff;
      padding: 16px 24px;
      width: 100%;
    }
    .header-banner h1 {
      font-size: 22px;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.2px;
    }

    /* Main Page Content Container */
    .content-container {
      padding: 28px 24px;
      max-width: 1200px;
    }

    /* Instruction Text (Red / Maroon) */
    .instruction-text {
      color: #b30000;
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 18px;
    }

    /* Search Bar Inline Layout */
    .search-box-row {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 24px;
    }

    .search-input {
      width: 240px;
      padding: 8px 12px;
      font-size: 15px;
      border: 1px solid #767676;
      border-radius: 0px; /* Matching classic Power Pages crisp square borders */
      outline: none;
    }
    .search-input:focus {
      border-color: #0078d4;
      box-shadow: 0 0 0 1px #0078d4;
    }

    .search-button {
      background-color: #0078d4;
      color: #ffffff;
      border: none;
      padding: 9px 24px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      border-radius: 0px;
      transition: background-color 0.15s ease-in-out;
    }
    .search-button:hover {
      background-color: #005a9e;
    }
    .search-button:active {
      background-color: #004578;
    }

    /* Error Message Area */
    .error-container {
      display: none;
      color: #d13438;
      font-weight: 600;
      font-size: 15px;
      margin-top: 12px;
      padding: 10px 14px;
      background-color: #fde7e9;
      border-left: 4px solid #d13438;
      max-width: 600px;
    }

    /* Results Card Layout */
    .result-container {
      display: none;
      margin-top: 20px;
      padding: 20px;
      background-color: #f3f2f1;
      border: 1px solid #e1dfdd;
      border-left: 5px solid #0078d4;
      max-width: 600px;
    }

    .result-header {
      font-size: 18px;
      font-weight: 700;
      color: #0078d4;
      margin-bottom: 14px;
      border-bottom: 1px solid #e1dfdd;
      padding-bottom: 8px;
    }

    .result-grid {
      display: grid;
      grid-template-columns: 140px 1fr;
      row-gap: 10px;
      font-size: 15px;
    }

    .result-label {
      font-weight: 700;
      color: #323130;
    }

    .result-value {
      color: #201f1e;
    }

    /* Map Section Styling */
    .map-wrapper {
      margin-top: 18px;
      border-top: 1px solid #e1dfdd;
      padding-top: 14px;
    }

    .map-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .map-title {
      font-weight: 700;
      font-size: 14px;
      color: #323130;
    }

    .nav-link {
      font-size: 13px;
      color: #0078d4;
      text-decoration: none;
      font-weight: 600;
    }
    .nav-link:hover {
      text-decoration: underline;
    }

    .map-frame {
      width: 100%;
      height: 220px;
      border: 1px solid #ccc;
      background-color: #e5e3df;
    }

    /* Loading Spinner */
    .loading-spinner {
      display: none;
      font-size: 14px;
      color: #605e5c;
      margin-top: 10px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- Top Blue Header Banner -->
  <div class="header-banner">
    <h1>Locate Your All Hands Transportation Assignment</h1>
  </div>

  <!-- Main Body Content -->
  <div class="content-container">
    
    <div class="instruction-text">
      To view your transportation assignment, enter your employee ID without leading zeros.
    </div>

    <!-- Inline Search Form -->
    <div class="search-box-row">
      <input 
        type="text" 
        id="employeeIdInput" 
        class="search-input" 
        placeholder="Enter Employee ID..." 
        onkeypress="handleKeyPress(event)"
      />
      <button class="search-button" onclick="performLookup()">Search</button>
    </div>

    <div id="loading" class="loading-spinner">Searching records...</div>

    <!-- Error Message Banner -->
    <div id="errorMessage" class="error-container"></div>

    <!-- Results Display Box -->
    <div id="resultCard" class="result-container">
      <div class="result-header">Transportation Details</div>
      <div class="result-grid">
        <div class="result-label">Name:</div>
        <div class="result-value" id="resName">-</div>

        <div class="result-label">Bus Number:</div>
        <div class="result-value" id="resBus">-</div>

        <div class="result-label">Pickup Time:</div>
        <div class="result-value" id="resTime">-</div>

        <div class="result-label">Pickup Location:</div>
        <div class="result-value" id="resLocation">-</div>
      </div>

      <!-- Map Embed Section -->
      <div id="mapSection" class="map-wrapper" style="display: none;">
        <div class="map-header-row">
          <span class="map-title">Map & Navigation:</span>
          <a id="navExternalLink" href="#" target="_blank" class="nav-link">Open in Google Maps ↗</a>
        </div>
        <iframe 
          id="mapIframe" 
          class="map-frame" 
          src="" 
          loading="lazy" 
          allowfullscreen>
        </iframe>
      </div>
    </div>

  </div>

  <script>
    // Power Automate HTTP POST Trigger URL
    const flowApiUrl = "https://96c6a42a47de44609505d751c9773b.5e.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/15/workflows/743ec3867a74458ab8322ea09120c06f/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=CyFcwCoTtCltM-nRqAvRs7cstRC0bqHBQsLs2I3bJPw";

    function handleKeyPress(event) {
      if (event.key === 'Enter') {
        performLookup();
      }
    }

    async function performLookup() {
      const empIdInput = document.getElementById('employeeIdInput').value.trim();
      const errorDiv = document.getElementById('errorMessage');
      const resultCard = document.getElementById('resultCard');
      const loadingDiv = document.getElementById('loading');
      const mapSection = document.getElementById('mapSection');
      const mapIframe = document.getElementById('mapIframe');
      const navExternalLink = document.getElementById('navExternalLink');

      // Reset previous views
      errorDiv.style.display = 'none';
      resultCard.style.display = 'none';
      mapSection.style.display = 'none';
      errorDiv.innerText = '';

      if (!empIdInput) {
        errorDiv.innerText = "Please enter your Employee ID.";
        errorDiv.style.display = 'block';
        return;
      }

      loadingDiv.style.display = 'block';

      try {
        const response = await fetch(flowApiUrl, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ employeeId: empIdInput })
        });

        if (!response.ok) {
          throw new Error("Unable to connect to lookup service. Please try again later.");
        }

        const data = await response.json();

        // Check if data returned valid fields
        if (!data || Object.keys(data).length === 0 || !data.ssi_bus) {
          throw new Error("No record found matching Employee ID '" + empIdInput + "'. Please check the ID and try again.");
        }

        // Construct Name
        const firstName = data.ssi_firstname || '';
        const lastName = data.ssi_lastname || '';
        const fullName = (firstName + ' ' + lastName).trim() || 'N/A';

        const locationAddress = data.ssi_locationaddress || '';

        // Populate details
        document.getElementById('resName').innerText = fullName;
        document.getElementById('resBus').innerText = data.ssi_bus || 'N/A';
        document.getElementById('resTime').innerText = data.ssi_pickuptime || 'N/A';
        document.getElementById('resLocation').innerText = locationAddress || 'N/A';

        // Render Map if address exists
        if (locationAddress && locationAddress !== 'N/A') {
          const encodedAddress = encodeURIComponent(locationAddress);
          
          // Embedded iframe search map
          mapIframe.src = `https://maps.google.com/maps?q=${encodedAddress}&t=&z=15&ie=UTF8&iwloc=&output=embed`;
          
          // Navigation link for opening directly in phone/browser Google Maps app
          navExternalLink.href = `https://www.google.com/maps/search/?api=1&query=${encodedAddress}`;
          
          mapSection.style.display = 'block';
        }

        // Show result box
        resultCard.style.display = 'block';

      } catch (err) {
        errorDiv.innerText = err.message || "An unexpected error occurred.";
        errorDiv.style.display = 'block';
      } finally {
        loadingDiv.style.display = 'none';
      }
    }
  </script>
</body>
</html>
